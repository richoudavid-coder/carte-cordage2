<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>3SETS BZH – Outils</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;
  font-family:-apple-system,'Segoe UI',sans-serif;
  background:linear-gradient(160deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  display:flex;justify-content:center;align-items:flex-start;
}
.app{
  width:100%;max-width:480px;
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  background:linear-gradient(160deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
}
.header{
  text-align:center;
  padding:16px 20px 12px;
  flex-shrink:0;
}
.header img{max-width:160px;height:auto;display:block;margin:0 auto}
.tabs{
  display:flex;
  margin:0 16px 4px;
  border-radius:14px;
  overflow:hidden;
  border:2px solid rgba(102,126,234,.6);
  flex-shrink:0;
}
.tab{
  flex:1;padding:11px 4px;border:none;
  background:rgba(255,255,255,.07);color:rgba(255,255,255,.7);
  font-size:13px;font-weight:700;cursor:pointer;line-height:1.3;
  transition:all .2s;
}
.tab.on{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.content{flex:1;min-width:0;padding:12px 16px 24px}
.pane{display:none}.pane.on{display:block}
/* INPUTS */
.grp{margin-bottom:14px}
label{display:block;color:rgba(255,255,255,.55);margin-bottom:5px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
input[inputmode=decimal]{
  width:100%;padding:13px 14px;
  border:2px solid rgba(255,255,255,.12);
  border-radius:10px;font-size:17px;
  -webkit-appearance:none;
  background:rgba(255,255,255,.08);
  color:#fff;
  transition:border-color .2s;
}
input[inputmode=decimal]::placeholder{color:rgba(255,255,255,.25)}
input[inputmode=decimal]:focus{outline:none;border-color:#667eea;background:rgba(102,126,234,.15)}
.sep{text-align:center;margin:10px 0;position:relative}
.sep::before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.1)}
.sep span{background:#16213e;padding:0 10px;position:relative;color:rgba(255,255,255,.35);font-size:11px;font-weight:700}
.tva-row{display:flex;gap:6px;margin-top:6px}
.tva-btn{
  flex:1;padding:9px 2px;
  border:2px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.07);
  border-radius:8px;cursor:pointer;
  font-weight:700;color:rgba(255,255,255,.6);font-size:13px;
  transition:all .2s;
}
.tva-btn.on{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-color:transparent}
/* RÉSULTATS */
.results{
  background:rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;padding:14px;margin-top:16px;
  display:none;
}
.r-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);
}
.r-row:last-child{border:none}
.r-lbl{font-size:12px;color:rgba(255,255,255,.5)}
.r-val{font-size:17px;font-weight:700;color:#fff}
.r-hl{
  background:linear-gradient(135deg,rgba(102,126,234,.3),rgba(118,75,162,.3));
  border:1px solid rgba(102,126,234,.4);
  border-radius:10px;padding:11px;margin:6px 0;
}
.r-hl .r-val{font-size:22px;color:#a78bfa}
.r-hl .r-lbl{color:rgba(255,255,255,.65)}
/* CALC */
.cdisp{
  background:rgba(0,0,0,.4);
  border-radius:14px;padding:14px 16px 10px;
  margin-bottom:10px;
  border:1px solid rgba(255,255,255,.08);
}
.cexpr{color:rgba(255,255,255,.35);font-size:12px;min-height:16px;text-align:right;margin-bottom:3px;word-break:break-all}
.cscr{color:#fff;font-size:38px;font-weight:200;text-align:right;word-break:break-all;min-height:48px;line-height:1.1}
.cmrow{display:flex;gap:5px;margin-bottom:8px}
.cm{
  flex:1;padding:7px 2px;border:none;border-radius:7px;
  background:rgba(255,255,255,.1);color:rgba(255,255,255,.65);
  font-size:11px;font-weight:700;cursor:pointer;
}
.cm:active{background:rgba(255,255,255,.2)}
.cm.on{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.cbgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cb{
  padding:17px 4px;border:none;border-radius:11px;
  font-size:17px;font-weight:600;cursor:pointer;
  transition:transform .1s;
  -webkit-user-select:none;user-select:none;
}
.cb:active{transform:scale(.9)}
.cbn{background:rgba(255,255,255,.12);color:#fff}
.cbo{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.cbeq{background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff}
.cbc{background:rgba(255,100,100,.7);color:#fff}
.cbf{background:rgba(167,139,250,.2);color:#a78bfa;font-size:13px}
.cs2{grid-column:span 2}
.chist{
  margin-top:10px;max-height:100px;overflow-y:auto;
  border-top:1px solid rgba(255,255,255,.08);
  padding-top:8px;display:none;
}
.chtitle{font-size:10px;color:rgba(255,255,255,.35);font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.chitem{
  font-size:11px;color:rgba(255,255,255,.45);
  padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05);
  display:flex;justify-content:space-between;
}
.chitem b{color:#a78bfa}
.hint{font-size:12px;line-height:1.5;color:rgba(255,255,255,.68);margin:4px 0 14px}
.grp.active label{color:#c4b5fd}
.grp.active input{border-color:#a78bfa}
input[aria-invalid=true]{border-color:#ff9696}
.status{font-size:12px;line-height:1.5;color:#ffd0d0;margin-top:10px;min-height:18px}
.reset{display:block;width:100%;padding:10px;margin-top:12px;border:1px solid rgba(255,255,255,.2);border-radius:9px;background:rgba(255,255,255,.07);color:#fff;font-size:13px;cursor:pointer}
button:focus-visible{outline:2px solid #ddd6fe;outline-offset:2px}
.r-lbl{padding-right:8px}.r-val{text-align:right;overflow-wrap:anywhere;min-width:0}
@media(max-width:360px){.content{padding-left:12px;padding-right:12px}.r-hl .r-val{font-size:19px}}
</style>
</head>

        <button class="cb cbf" onclick="cSqrt()">√</button>
        <button class="cb cbf" onclick="cSq()">x²</button>
        <button class="cb cbf" onclick="cInv()">1/x</button>
        <button class="cb cbf" onclick="cBack()">⌫</button>
      </div>
      <div class="chist" id="chist">
        <div class="chtitle">Historique</div>
        <div id="chistList"></div>
      </div>
    </div>

  </div><!-- .content -->
</div><!-- .app -->

<script>
'use strict';
const $ = id => document.getElementById(id);
const all = sel => [...document.querySelectorAll(sel)];
function sw(id,btn){
  all('.pane').forEach(p=>p.classList.toggle('on',p.id===id));
  all('.tab').forEach(b=>{b.classList.toggle('on',b===btn);b.setAttribute('aria-pressed',String(b===btn));});
  if(document.activeElement && document.activeElement.tagName==='INPUT') document.activeElement.blur();
}
// MARGE : le champ saisi est la référence, jamais une valeur dérivée arrondie.
let tva=20, source=null;
const criteria=['mg','co','pvHT','pvTTC'];
const moneyFmt=new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const f2=n=>moneyFmt.format(n===0?0:n);
const input2=n=>(n===0?0:n).toFixed(2).replace('.',',');
function readNumber(id){
  const v=$(id).value.trim().replace(/\s/g,'');
  if(!v) return null;
  if(!/^[+-]?(?:\d+(?:[.,]\d*)?|[.,]\d+)$/.test(v)) return NaN;
  const n=Number(v.replace(',','.'));
  return Number.isFinite(n)?n:NaN;
}
function clearResults(message='',invalid=[]){
  $('res').style.display='none';
  ['rHT','rTTC','rBrute','rPct','rCoeff','rMarge'].forEach(id=>$(id).textContent='');
  criteria.forEach(id=>{if(id!==source) $(id).value='';});
  $('status').textContent=message;
  ['pa',...criteria].forEach(id=>$(id).setAttribute('aria-invalid',String(invalid.includes(id))));
}
function recalc(){
  const pa=readNumber('pa');
  const v=source===null?null:readNumber(source);
  criteria.forEach(id=>$(id).closest('.grp').classList.toggle('active',id===source));
  if(pa===null){clearResults('Saisis le prix d’achat HT.');return;}
  if(!Number.isFinite(pa)||pa<=0){clearResults('Le prix d’achat doit être supérieur à zéro.',['pa']);return;}
  if(source===null||v===null){clearResults('Saisis un taux, un coefficient ou un prix de vente.');return;}
  if(!Number.isFinite(v)){clearResults('Saisis un nombre valide (virgule ou point).',[source]);return;}
  if(source==='mg'&&v>=100){clearResults('Le taux de marque doit être inférieur à 100 %.',[source]);return;}
  if(source!=='mg'&&v<=0){clearResults('Le prix de vente ou le coefficient doit être supérieur à zéro.',[source]);return;}
  const factor=1+tva/100;
  let pv,ttc;
  switch(source){
    case 'mg': pv=pa/(1-v/100); break;
    case 'co': pv=pa*v; break;
    case 'pvHT': pv=v; break;
    case 'pvTTC': pv=v/factor;ttc=v;break;
  }
  if(ttc===undefined) ttc=pv*factor;
  const mb=pv-pa, marque=source==='mg'?v:mb/pv*100, marge=mb/pa*100, coeff=source==='co'?v:pv/pa;
  if(pv<=0||![pv,ttc,mb,marque,marge,coeff].every(Number.isFinite)||[pv,ttc,Math.abs(mb),Math.abs(marque),Math.abs(marge),coeff].some(n=>n>=1e15)){
    clearResults('Valeurs hors des limites de calcul.',[source]);return;
  }
  const values={pvHT:pv,pvTTC:ttc,mg:marque,co:coeff};
  criteria.forEach(id=>{if(id!==source) $(id).value=input2(values[id]);});
  $('rHT').textContent=f2(pv)+' €';
  $('rTTC').textContent=f2(ttc)+' €';
  $('rBrute').textContent=f2(mb)+' €';
  $('rPct').textContent=f2(marque)+' %';
  $('rCoeff').textContent='×'+f2(coeff);
  $('rMarge').textContent=f2(marge)+' %';
  ['pa',...criteria].forEach(id=>$(id).setAttribute('aria-invalid','false'));
  $('status').textContent=mb<0?'Attention : vente à perte (prix HT inférieur au prix d’achat).':'';
  $('res').style.display='block';
}
$('pa').addEventListener('input',recalc);
criteria.forEach(id=>$(id).addEventListener('input',()=>{source=id;recalc();}));
function setTVA(value){
  tva=value;
  all('.tva-btn').forEach(b=>{const on=Number(b.dataset.t)===tva;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));});
  recalc();
}
all('.tva-btn').forEach(b=>b.addEventListener('click',()=>setTVA(Number(b.dataset.t))));
function resetMarge(){
  source=null;
  ['pa',...criteria].forEach(id=>$(id).value='');
  setTVA(20);$('status').textContent='';
}
// CALCULATRICE : exécution séquentielle, comme une calculatrice de poche.
let cv='0',cop=null,cprev=null,cnew=true,entered=false,cmem=0,hasMem=false,chist=[],repeat=null;
const symbols={'+':'+','-':'−','*':'×','/':'÷'};
function scr(){$('cScr').textContent=cv.replace('.',',');}
function expr(s){$('cExpr').textContent=s;}
function fmt(n){return Number.isFinite(n)?Number(n.toPrecision(15)).toString():'Erreur';}
function shown(n){return fmt(n).replace('.',',');}
function applyOp(a,b,op){switch(op){case '+':return a+b;case '-':return a-b;case '*':return a*b;case '/':return b===0?NaN:a/b;default:return NaN;}}
function fail(){cv='Erreur';cop=null;cprev=null;cnew=true;entered=false;repeat=null;expr('Calcul impossible');scr();}
function beginEntry(){if(cv==='Erreur') cClr();if(cnew){if(cop===null){expr('');repeat=null;}cv='0';cnew=false;}entered=true;}
function cN(n){beginEntry();if(cv.replace(/[^0-9]/g,'').length>=15)return;if(cv==='0')cv=n;else if(cv==='-0')cv='-'+n;else cv+=n;scr();}
function cDot(){beginEntry();if(!cv.includes('.'))cv+='.';scr();}
function cOp(op){
  if(cv==='Erreur')return;
  if(cop!==null && entered){const result=applyOp(cprev,Number(cv),cop);if(!Number.isFinite(result)){fail();return;}cv=fmt(result);cprev=Number(cv);}
  else if(cop===null)cprev=Number(cv);
  cop=op;cnew=true;entered=false;repeat=null;
  cv=fmt(cprev);scr();expr(shown(cprev)+' '+symbols[op]);
}
function cEq(){
  if(cv==='Erreur')return;
  let a,b,op;
  if(cop!==null){if(!entered)return;a=cprev;b=Number(cv);op=cop;}
  else if(repeat){a=Number(cv);b=repeat.b;op=repeat.op;}
  else return;
  const e=shown(a)+' '+symbols[op]+' '+shown(b), r=applyOp(a,b,op);
  if(!Number.isFinite(r)){fail();return;}
  cv=fmt(r);chist.unshift({e,r:shown(r)});if(chist.length>10)chist.pop();renderHist();
  expr(e+' =');scr();repeat={op,b};cprev=null;cop=null;cnew=true;entered=false;
}
function cClr(){cv='0';cop=null;cprev=null;cnew=true;entered=false;repeat=null;expr('');scr();}
function cBack(){if(cnew||cv==='Erreur')return;cv=cv.slice(0,-1);if(!cv||cv==='-')cv='0';scr();}
function unary(fn){
  if(cv==='Erreur'||(cop!==null&&!entered))return;
  if(cop===null)expr('');
  const v=fn(Number(cv));if(!Number.isFinite(v)){fail();return;}
  cv=fmt(v);entered=true;cnew=true;repeat=null;scr();
}
function cSign(){
  if(cv==='Erreur')return;
  if(cop!==null&&!entered){cv='-0';cnew=false;entered=true;scr();return;}
  if(cnew&&cop===null){expr('');repeat=null;}
  cv=cv.startsWith('-')?cv.slice(1):'-'+cv;entered=true;scr();
}
function cPct(){
  if(cv==='Erreur'||(cop!==null&&!entered))return;
  unary(v=>(cop==='+'||cop==='-')?cprev*(v/100):v/100);
}
function cSqrt(){unary(v=>v>=0?Math.sqrt(v):NaN);}
function cSq(){unary(v=>v*v);}
function cInv(){unary(v=>v===0?NaN:1/v);}
function updateMem(){const b=$('mBtn');b.classList.toggle('on',hasMem);b.setAttribute('aria-pressed',String(hasMem));}
function memorySet(v){if(!Number.isFinite(v))return;cmem=v;hasMem=true;updateMem();}
function mS(){if(cv!=='Erreur')memorySet(Number(cv));}
function mR(){if(hasMem){if(cv==='Erreur')cClr();if(cop===null)expr('');cv=fmt(cmem);entered=true;cnew=true;repeat=null;scr();}}
function mA(){if(cv!=='Erreur')memorySet(cmem+Number(cv));}
function mSb(){if(cv!=='Erreur')memorySet(cmem-Number(cv));}
function mC(){cmem=0;hasMem=false;updateMem();}
function renderHist(){
  $('chist').style.display=chist.length?'block':'none';
  $('chistList').replaceChildren(...chist.map(h=>{const row=document.createElement('div');row.className='chitem';const e=document.createElement('span'),r=document.createElement('b');e.textContent=h.e;r.textContent=h.r;row.append(e,r);return row;}));
}
document.addEventListener('keydown',e=>{
  if(!$('calc').classList.contains('on')||e.ctrlKey||e.metaKey||e.altKey||e.target.matches('input,textarea,[contenteditable]'))return;
  let action=null;
  if(/^[0-9]$/.test(e.key))action=()=>cN(e.key);
  else if(e.key==='.'||e.key===',')action=cDot;
  else if(['+','-','*','/'].includes(e.key))action=()=>cOp(e.key);
  else if(e.key==='Enter'||e.key==='=')action=cEq;
  else if(e.key==='Escape'||e.key==='Delete')action=cClr;
  else if(e.key==='Backspace')action=cBack;
  else if(e.key==='%')action=cPct;
  if(action){e.preventDefault();action();}
});
</script>
</body>
</html>
